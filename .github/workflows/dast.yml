name: DAST - Juice Shop ZAP Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  zap-full-scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Juice Shop
        run: |
          docker run -d --rm --name juice-shop -p 3000:3000 bkimminich/juice-shop

      - name: Wait for Juice Shop to be ready
        run: |
          timeout 300 bash -c 'until curl -fsS http://127.0.0.1:3000/ >/dev/null; do sleep 5; done'

      - name: Run OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://127.0.0.1:3000
          fail_action: true
          allow_issue_writing: false

      - name: Stop Juice Shop
        if: always()
        run: docker rm -f juice-shop