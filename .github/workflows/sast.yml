name: SAST – CodeQL Analysis

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  codeql-analysis:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Initialise CodeQL ───────────────────────────────────────
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript   # correct v3 extractor name
          build-mode: none                   # skip build tracing; scan files directly
          queries: security-extended

      # ── 3. Run the analysis ────────────────────────────────────────
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: true

      # ── 4. Block pipeline on any findings ──────────────────────────
      - name: Block pipeline on findings
        run: |
          SARIF_FILE=$(ls sarif-results/*.sarif 2>/dev/null | head -n 1)
          if [ -z "$SARIF_FILE" ]; then
            echo "No SARIF file found – treating as clean."
            exit 0
          fi
          RESULT_COUNT=$(jq '[.runs[].results // [] | length] | add // 0' "$SARIF_FILE")
          echo "CodeQL findings: $RESULT_COUNT"
          if [ "$RESULT_COUNT" -gt 0 ]; then
            echo "::error::SAST gate failed – $RESULT_COUNT vulnerabilit(y/ies) detected. Review the Security tab."
            exit 1
          fi
          echo "No vulnerabilities found. Pipeline continues."