name: SAST – CodeQL Analysis

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  codeql-analysis:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Initialise CodeQL ───────────────────────────────────────
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript   # explicit extractor name
          queries: security-extended
          source-root: .                     # explicitly point at repo root

      # ── NOTE: No autobuild step – it is not needed for JavaScript/  
      #    TypeScript and was causing "no source detected" failures.   

      # ── 3. Run the analysis ────────────────────────────────────────
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: true

      # ── 4. Block pipeline on any findings ──────────────────────────
      - name: Block pipeline on findings
        run: |
          SARIF_FILE=$(ls sarif-results/*.sarif 2>/dev/null | head -n 1)
          if [ -z "$SARIF_FILE" ]; then
            echo "No SARIF file found – treating