name: SCA - Ruby Dependency Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  dependency-audit:
    name: Bundler Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Install Bundler Audit
        run: gem install bundler-audit

      - name: Audit Ruby dependencies
        run: bundle audit check --update